# Selene std overlay for SatEngine. Winget builds ship lua51 as the only base std;
# LuaLS (.luarc.json) remains the Lua 5.4 authority for language version.
base: lua51
name: satengine
globals:
  sat:
    any: true
  self:
    any: true
  onStart:
    any: true
  onUpdate:
    any: true
  onStop:
    any: true
  onMessage:
    any: true
